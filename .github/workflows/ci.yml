name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref to save resources.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: only read access is required for CI.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Install dependencies once, populating the npm cache so that downstream
  # matrix jobs hit the cache instead of doing a fresh network install.
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

  # Run lint, build, and tests for each workspace in parallel.
  # Scripts are invoked with --if-present so a workspace that does not
  # define a given script (e.g. api has no lint, frontend has no test)
  # is skipped gracefully rather than failing the job.
  verify:
    name: ${{ matrix.workspace }} (lint, build, test)
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install workspace dependencies (from cache)
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }} --if-present

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }} --if-present

      - name: Test
        run: npm run test --workspace=${{ matrix.workspace }} --if-present
